<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엔트리 유저 찾기</title>
<style>
  /* 애플체 폰트 */
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "San Francisco", "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; 
    background:#f4f4f9; 
    color:#333; 
    margin:0; 
    padding:0; 
  }

  header { 
    background:#4b6cf7; 
    color:white; 
    padding:20px; 
    text-align:center; 
    display:flex;
    flex-direction: column;
    align-items: center;
  }

  header img {
    width: 120px;
    max-width: 30%;
    height: auto;
    margin-bottom: 10px;
    cursor:pointer;
  }

  main { 
    max-width:600px; 
    margin:40px auto; 
    padding:20px; 
    background:white; 
    border-radius:10px; 
    box-shadow:0 4px 10px rgba(0,0,0,0.1); 
  }

  input { 
    width: calc(100% - 120px); 
    padding:10px; 
    font-size:16px; 
    border-radius:5px; 
    border:1px solid #ccc; 
  }

  button { 
    padding:10px 20px; 
    font-size:16px; 
    border:none; 
    border-radius:5px; 
    background:#4b6cf7; 
    color:white; 
    cursor:pointer; 
    margin-left:5px; 
  }

  button:hover { background:#3a52d1; }

  h2 { margin-top:30px; }
  ul { list-style:none; padding-left:0; }
  li { margin:5px 0; }
  .history-btn { background:#eee; color:#333; margin-right:5px; border-radius:5px; padding:5px 10px; cursor:pointer;}
  .history-btn:hover { background:#ddd; }
</style>
</head>
<body>

<header>
  <!-- 로고: 클릭 시 첫 검색 기록 링크 이동 -->
  <img src="무제241_20260128122600.png" alt="엔트리 유저 찾기 로고" id="logo">
  <h1>엔트리 유저 찾기 (구글 검색)</h1>
  <p>닉네임 입력 후 검색 버튼 클릭 → 엔트리 프로필 검색</p>
</header>

<main>
  <div>
    <input type="text" id="nickname" placeholder="닉네임 입력">
    <button onclick="searchUser()">검색</button>
  </div>

  <h2>최근 검색</h2>
  <ul id="historyList"></ul>
</main>

<script>
// 최근 검색 기록 불러오기
let history = JSON.parse(localStorage.getItem('history')||[]);

// 최근 검색 목록 렌더링
function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  history.slice(-10).reverse().forEach(nickname => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.textContent = nickname;
    btn.className = 'history-btn';
    btn.onclick = () => searchUser(nickname);
    li.appendChild(btn);
    list.appendChild(li);
  });
}
renderHistory();

// 닉네임 검색
function searchUser(inputName) {
  let nickname = inputName || document.getElementById('nickname').value.trim();
  if(!nickname) return alert("닉네임 입력하세요....");

  // 최근 검색 저장
  if(!history.includes(nickname)) {
    history.push(nickname);
    localStorage.setItem('history', JSON.stringify(history));
    renderHistory();
  }

  // 구글 검색 URL
  const query = encodeURIComponent(`${nickname} site:playentry.org/profile`);
  const url = `https://www.google.com/search?q=${query}`;
  window.open(url, '_blank');
}

// 로고 클릭 시 첫 번째 검색 기록으로 이동
document.getElementById('logo').addEventListener('click', () => {
  if(history.length === 0) return alert("최근 검색 기록이 없습니다.");
  const firstNickname = history[0];
  const query = encodeURIComponent(`${firstNickname} site:playentry.org/profile`);
  const url = `https://www.google.com/search?q=${query}`;
  window.open(url, '_blank');
});
</script>

</body>
</html>
